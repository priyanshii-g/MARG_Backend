<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MARG – Kaziranga–Karbi Anglong v0.5</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .panel { position: absolute; z-index: 1000; top: 12px; left: 12px; max-width: 410px; background: white; padding: 12px 14px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.2); font-family: sans-serif; }
    .panel small { color: #555; }
    button { margin: 8px 6px 0 0; padding: 7px 10px; cursor: pointer; }
    #status { margin-top: 8px; white-space: pre-wrap; max-height: 260px; overflow: auto; }
  </style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <strong>MARG v0.5</strong><br/>
  <small>Greenfield alignment — Kohora area (A) to Diphu area (B)</small><br/>
  <button id="distanceBtn">Distance baseline</button>
  <button id="lulcBtn">LULC route</button>
  <button id="boundedBtn">LULC ≤ 15% detour</button>
  <button id="surfaceBtn">Show LULC cost surface</button>
  <div id="status">Loading study region...</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(async function () {
  const API = 'http://localhost:8080';
  const map = L.map('map').setView([26.2, 93.43], 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const status = document.getElementById('status');
  const region = await fetch(`${API}/api/study-region`).then(r => r.json());
  const b = region.bbox;
  map.fitBounds([[b.minLat, b.minLon], [b.maxLat, b.maxLon]]);

  L.marker([region.origin.lat, region.origin.lon]).addTo(map).bindPopup('A — Kohora area');
  L.marker([region.destination.lat, region.destination.lon]).addTo(map).bindPopup('B — Diphu area');

  const wmsUrl = `${API}/api/bhuvan/map/assam-lulc-50k-1516`
      + `?minLon=${b.minLon}&minLat=${b.minLat}&maxLon=${b.maxLon}&maxLat=${b.maxLat}`;
  L.imageOverlay(wmsUrl, [[b.minLat, b.minLon], [b.maxLat, b.maxLon]], { opacity: 0.28 }).addTo(map);

  let routeLayer;
  let surfaceLayer;
  async function loadRoute(url, label) {
    status.textContent = `Requesting ${label}...`;
    if (routeLayer) map.removeLayer(routeLayer);
    try {
      const fc = await fetch(url).then(async r => {
        const body = await r.json();
        if (!r.ok) throw new Error(JSON.stringify(body));
        return body;
      });
      routeLayer = L.geoJSON(fc, {
        style: feature => {
          const profile = feature.properties && feature.properties.profile;
          return { weight: 5, color: profile === 'DISTANCE_BASELINE' ? '#2563eb' : '#dc2626', opacity: 0.9 };
        }
      }).addTo(map);
      map.fitBounds(routeLayer.getBounds(), { padding: [30, 30] });
      status.textContent = `${label} loaded.\n` + JSON.stringify({metadata: fc.metadata, features: fc.features.map(f => f.properties)}, null, 2);
    } catch (e) {
      status.textContent = `Route failed:\n${e.message}`;
    }
  }

  async function loadSurface() {
    status.textContent = 'Requesting LULC cost surface...';
    if (surfaceLayer) map.removeLayer(surfaceLayer);
    try {
      const fc = await fetch(`${API}/api/routes/cost-surface`).then(async r => {
        const body = await r.json();
        if (!r.ok) throw new Error(JSON.stringify(body));
        return body;
      });
      const weight = p => Number(p.penaltyMultiplier || 0);
      surfaceLayer = L.geoJSON(fc, {
        style: feature => {
          const p = feature.properties;
          const palette = {
            BUILT_UP: '#dc2626',
            FOREST: '#15803d',
            WETLAND_WATER: '#2563eb',
            AGRICULTURE: '#ca8a04',
            GRASS_GRAZING: '#65a30d',
            BARREN_WASTELAND: '#a16207',
            SNOW: '#e5e7eb',
            UNKNOWN: '#6b7280'
          };
          return {
            weight: 1,
            color: palette[p.lulcClass] || '#6b7280',
            fillColor: palette[p.lulcClass] || '#6b7280',
            fillOpacity: 0.35,
            opacity: 0.55
          };
        },
        onEachFeature: (feature, layer) => {
          const p = feature.properties;
          layer.bindPopup(`${p.lulcClass}<br/>Penalty: ${p.penaltyMultiplier}<br/>Remote: ${p.remoteSuccess}`);
        }
      }).addTo(map);
      status.textContent = `Cost surface loaded: ${fc.features.length} cells.`;
    } catch (e) {
      status.textContent = `Cost surface failed:\n${e.message}`;
    }
  }

  document.getElementById('distanceBtn').onclick = () => loadRoute(`${API}/api/routes?mode=distance`, 'distance baseline');
  document.getElementById('lulcBtn').onclick = () => loadRoute(`${API}/api/routes?mode=lulc`, 'LULC route');
  document.getElementById('boundedBtn').onclick = () => loadRoute(`${API}/api/routes?mode=lulc&maxDeviationPercent=15`, 'LULC route with 15% maximum deviation');
  document.getElementById('surfaceBtn').onclick = loadSurface;
  await loadRoute(`${API}/api/routes?mode=distance`, 'distance baseline');
})();
</script>
</body>
</html>
