spring:
  application:
    name: marg-routing-prototype

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

marg:
  study-region: kaziranga-karbi-anglong
  routing:
    corridor-buffer-deg: 0.15
    # Internal routing grid. Coordinates are projected to UTM 46N before search.
    resolution-meters: 250
    utm-zone: 46
    lulc:
      # Dimensionless additive movement-cost contributions.
      # 0 = no extra cost; values are MARG model parameters, not official land-use values.
      penalties:
        BUILT_UP: 1.5
        FOREST: 0.8
        WETLAND_WATER: 2.0
        AGRICULTURE: 0.25
        GRASS_GRAZING: 0.10
        BARREN_WASTELAND: 0.0
        SNOW: 2.5
        UNKNOWN: 0.0
    slope:
      free-max-degrees: 5.0
      low-max-degrees: 10.0
      moderate-max-degrees: 15.0
      steep-max-degrees: 25.0
      very-steep-max-degrees: 30.0

      low-penalty: 0.15
      moderate-penalty: 0.40
      steep-penalty: 1.00
      very-steep-penalty: 2.00

      block-no-data: true
      block-above-very-steep: true

    flood:
      penalties:
        VERY_LOW: 0.0
        LOW: 0.20
        MODERATE: 0.60
        HIGH: 1.50
        VERY_HIGH: 3.00
        NOT_IN_HAZARD_LAYER: 0.0
        UNKNOWN: 2.00

  terrain:
    slope-path: data/processed/dem/assam_slope_utm46.tif

  protected-area:
    raster-path: data/processed/protected-areas/assam_protected_area_mask_utm46.tif
  bhuvan:
    lulc:
      sample-resolution-deg: 0.01
      query-half-size-deg: 0.004
      parallelism: 6
      cache-file: data/cache/bhuvan-lulc-samples.json
      max-remote-samples: 4000
    flood-raster:
      cache-directory: data/cache/bhuvan-flood-wms
      tile-pixels: 512
      target-pixels-per-degree: 1000
      color-tolerance: 28
      classification-window-radius: 1
